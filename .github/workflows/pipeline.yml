name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:    
    runs-on: ubuntu-latest    
    steps:      
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6        
        with:          
          node-version: '24'
      - name: Install dependencies        
        run: npm install
      - name: Check style         
        run: npm run eslint
      - name: Run npm test      
        run: npm run test
      - name: Run npm build     
        run: npm run build
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:    
    needs: [deploy]
    runs-on: ubuntu-latest    
    steps:      
      - uses: actions/checkout@v6
      - name: Deploy setup
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  tag-release: 
    needs: [build_and_test, deploy ]   
    runs-on: ubuntu-latest    
    steps: 
      - uses: actions/checkout@v6

      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch


  notification-discord: 
    needs: [tag-release, build_and_test, deploy]
    if: always()
    runs-on: ubuntu latest
    steps: 
      - uses: actions/checkout@v6

      - name: Discord notification(success)
        if: ${{ success() }}
        uses: Ilshidur/action-discord@master
        with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{job.status}}
        title: "Deployment succeeded"
        description: "A new version was deployed"

      - name: Discord notification(failure)
        if: ${{ failure() }}
        uses: Ilshidur/action-discord@master
        with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{job.status}}
        title: "Build failed"
        description: "Commit ${{ github.sha }} by ${{ github.actor }} broke the build. See: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"